<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account - ShoeSure</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: radial-gradient(circle at 50% 20%, rgba(121, 40, 202, 0.08) 0%, transparent 50%), var(--bg-main);">

    <!-- Sticky Glass Navbar -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='../index.html'">
            <i class="fa-solid fa-shoe-prints"></i> ShoeSure
        </div>
        
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="how-it-works.html">How It Works</a>
            <a href="contact.html">Contact Support</a>
        </div>

        <div class="nav-actions">
            <button class="btn btn-outline" onclick="window.location.href='login.html'">Sign In</button>
        </div>

        <div class="hamburger">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </nav>

    <!-- Register Form Container -->
    <section class="section">
        <div class="form-card" style="max-width: 480px; text-align: center;">
            <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(121, 40, 202, 0.1); color: var(--accent-purple); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 20px;">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h2 style="font-size: 28px; margin-bottom: 6px;">Create an Account</h2>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 28px;">Join ShoeSure as a Customer, Cobbler, or Seller</p>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="contact">Phone Number</label>
                    <input type="text" id="contact" name="contact" class="form-control" placeholder="+91 9876543210" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">Select Your Role</label>
                    <select id="role" name="role" class="form-control" required>
                        <option value="customer">Customer / Shoe Buyer</option>
                        <option value="artisan">Artisan Cobbler / Repair Specialist</option>
                        <option value="seller">Shoe Seller / Store Vendor (0% Fee)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Create Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
                </div>

                <button type="submit" id="register-btn" class="btn btn-primary" style="width: 100%; padding: 14px; margin-top: 10px;">
                    Create Account <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <p style="margin-top: 24px; font-size: 14px; color: var(--text-secondary);">
                Already have an account? <a href="login.html" style="font-weight: 700; color: var(--primary);">Sign In here</a>
            </p>
        </div>
    </section>

    <!-- Scripts -->
    <script src="../js/main.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
