<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ShoeSure</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: radial-gradient(circle at 50% 20%, rgba(255, 0, 122, 0.08) 0%, transparent 50%), var(--bg-main);">

    <!-- Sticky Glass Navbar -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='../index.html'">
            <i class="fa-solid fa-shoe-prints"></i> ShoeSure
        </div>
        
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="how-it-works.html">How It Works</a>
            <a href="contact.html">Contact Support</a>
        </div>

        <div class="nav-actions">
            <button class="btn btn-primary" onclick="window.location.href='register.html'">Register</button>
        </div>

        <div class="hamburger">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </nav>

    <!-- Login Container -->
    <section class="section">
        <div class="form-card" style="max-width: 440px; text-align: center;">
            <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 0, 122, 0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 20px;">
                <i class="fa-solid fa-lock"></i>
            </div>
            
            <h2 style="font-size: 28px; margin-bottom: 6px;">Welcome Back</h2>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 28px;">Sign in to your ShoeSure account</p>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; margin-top: 10px;">
                    Sign In <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>

            <p style="margin-top: 24px; font-size: 14px; color: var(--text-secondary);">
                Don't have an account? <a href="register.html" style="font-weight: 700; color: var(--primary);">Create Account</a>
            </p>
        </div>
    </section>

    <!-- Scripts -->
    <script src="../js/main.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
