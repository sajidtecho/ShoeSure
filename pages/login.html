<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShoeSure</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='../index.html'">
            <i class="fa-solid fa-shoe-prints"></i> ShoeSure
        </div>
        
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="how-it-works.html">How It Works</a>
            <a href="contact.html">Contact Us</a>
        </div>

        <div class="buttons">
            <button class="btn btn-primary" onclick="window.location.href='register.html'">Register</button>
        </div>

        <div class="hamburger">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </nav>

    <!-- Login Container -->
    <main class="form-container" style="max-width: 400px; margin-top: 60px;">
        <i class="fa-solid fa-user-lock fa-3x" style="color: var(--primary-color); margin-bottom: 15px;"></i>
        <h2>Sign In to ShoeSure</h2>
        <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">Access your customer or seller dashboard</p>

        <form id="login-form">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <p style="margin-top: 20px; font-size: 14px;">
            Don't have an account? <a href="register.html">Create an Account</a>
        </p>
    </main>

    <!-- Scripts -->
    <script src="../js/main.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
