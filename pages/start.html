<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started - ShoeSure</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: radial-gradient(circle at 50% 30%, rgba(255, 0, 122, 0.1) 0%, transparent 60%), var(--bg-main);">

    <!-- Sticky Glass Navbar -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='../index.html'">
            <i class="fa-solid fa-shoe-prints"></i> ShoeSure
        </div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="seller.html">Become a Seller</a>
        </div>
    </nav>

    <!-- Start Gateway Card -->
    <section class="section">
        <div class="form-card" style="max-width: 480px; text-align: center; margin-top: 40px;">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 20px; box-shadow: var(--shadow-glow);">
                <i class="fa-solid fa-shoe-prints"></i>
            </div>
            
            <h2 style="font-size: 32px; margin-bottom: 8px;">Welcome to ShoeSure</h2>
            <p style="color: var(--text-secondary); font-size: 15px; margin-bottom: 30px;">Select an option to access your account or register a new one.</p>

            <div style="display: flex; flex-direction: column; gap: 14px;">
                <a href="register.html" class="btn btn-primary" style="padding: 14px;">
                    <i class="fa-solid fa-user-plus"></i> Create New Account
                </a>
                <a href="login.html" class="btn btn-outline" style="padding: 14px;">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In to Account
                </a>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="../js/main.js"></script>
</body>
</html>
