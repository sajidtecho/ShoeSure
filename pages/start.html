<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started - ShoeSure</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='../index.html'">
            <i class="fa-solid fa-shoe-prints"></i> ShoeSure
        </div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
        </div>
        <div class="hamburger">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </nav>

    <main class="form-container" style="max-width: 500px; margin-top: 80px;">
        <h2>Welcome to ShoeSure</h2>
        <p style="margin: 15px 0 25px; color: var(--text-muted);">Select an option below to access your account or register a new one.</p>
        
        <div style="display: flex; gap: 15px; justify-content: center;">
            <button class="btn btn-primary" onclick="window.location.href='register.html'">Register Account</button>
            <button class="btn btn-outline" onclick="window.location.href='login.html'">Sign In</button>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/main.js"></script>
</body>
</html>
