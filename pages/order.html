<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order - ShoeSure</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Sticky Glass Navbar -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='../index.html'">
            <i class="fa-solid fa-shoe-prints"></i> ShoeSure
        </div>
        
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="order.html" class="active">Place Order</a>
            <a href="how-it-works.html">How It Works</a>
            <a href="contact.html">Contact Support</a>
        </div>

        <div class="nav-actions">
            <button class="btn btn-outline" onclick="window.location.href='login.html'">Login</button>
            <button class="btn btn-primary" onclick="window.location.href='register.html'">Register</button>
        </div>

        <div class="hamburger">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </nav>

    <!-- Header -->
    <header class="hero" style="padding: 50px 5% 20px; text-align: center;">
        <div style="max-width: 600px; margin: 0 auto;">
            <div class="pill-badge"><i class="fa-solid fa-cart-flatbed"></i> Order Placement</div>
            <h1 class="hero-title" style="font-size: 38px;">Book Service or <span>Footwear</span></h1>
            <p class="hero-subtitle">Enter your service or repair details below to schedule doorstep pickup.</p>
        </div>
    </header>

    <!-- Order Form Container -->
    <section class="section" style="padding-top: 10px;">
        <div class="form-card" style="max-width: 520px;">
            <h2 style="font-size: 24px; margin-bottom: 20px;">Order & Pickup Form</h2>
            
            <form id="order-form">
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="service-type">Service or Product Category</label>
                    <select id="service-type" name="service_type" class="form-control" required>
                        <option value="renovation">Shoe Renovation & Restoration</option>
                        <option value="customization">Custom Sneaker Artwork & Painting</option>
                        <option value="resole">Sole Replacement & Re-stitching</option>
                        <option value="cleaning">Deep Cleaning & Wax Polish</option>
                        <option value="purchase">Buy Artisan Footwear</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="size">Shoe Size (UK / India standard)</label>
                    <select id="size" name="size" class="form-control" required>
                        <option value="6">UK / IND 6</option>
                        <option value="7">UK / IND 7</option>
                        <option value="8">UK / IND 8</option>
                        <option value="9">UK / IND 9</option>
                        <option value="10">UK / IND 10</option>
                        <option value="11">UK / IND 11</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="address">Pickup / Delivery Address</label>
                    <textarea id="address" name="address" class="form-control" placeholder="Street address, city, pincode..." rows="4" required></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">
                    <i class="fa-solid fa-check-circle"></i> Confirm & Schedule Pickup
                </button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer-modern">
        <div class="footer-bottom" style="border: none; padding: 0;">
            <p>&copy; 2026 ShoeSure Orders Desk. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="../js/main.js"></script>
    <script>
        document.getElementById('order-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Order placed successfully! A ShoeSure courier representative will contact you for pickup.");
            window.location.href = "../index.html";
        });
    </script>
</body>
</html>
